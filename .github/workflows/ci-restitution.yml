name: CI RESTITUTION

# [1] WHEN IT RUNS — PRs, merges, a twice-monthly re-scan, and a manual button.
on:
  pull_request:
    branches: [development]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "docs/**"
  push:
    branches: [development]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "docs/**"
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

# [2] GUARD RAIL · LEAST PRIVILEGE — read code, write scan reports, nothing else
permissions:
  contents: read
  security-events: write
  actions: read

# [3] GUARD RAIL · ONE RUN AT A TIME — a newer push cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# [4] THE JOB — 'gate' is the exact check name branch protection requires green
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # [5] SETUP -> UI half (build) -> API half (compile) -> whole codebase (CodeQL)
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp,javascript-typescript
          queries: security-extended

      # ── UI HALF: build the Angular SPA (served by Caddy) ──
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: restitution-app/ClientApp/package-lock.json
      - working-directory: restitution-app/ClientApp
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          npm run buildprod
      - name: Check UI packages for HIGH or CRITICAL advisories
        working-directory: restitution-app/ClientApp
        run: npm audit --audit-level=high --omit=dev

      # ── API HALF: compile the .NET app (no CSharpier gate on restitution) ──
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build restitution-app/restitution-app.csproj -c Release
      - name: Check API packages for HIGH or CRITICAL advisories
        run: |
          dotnet list restitution-app/restitution-app.csproj package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -E 'NU1900|NU1903|NU1904|^\s+>.*\s(High|Critical)\s' vulnerable.txt; then exit 1; fi
      - name: Check tracked files for secrets
        run: |
          if git grep -lIE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KE[Y]|AKIA[0-9A-Z]{16}'; then
            echo "Secret pattern found in the files listed above"
            exit 1
          fi

      # ── WHOLE CODEBASE: CodeQL writes its report — C# + TypeScript, one run ──
      - uses: github/codeql-action/analyze@v4
