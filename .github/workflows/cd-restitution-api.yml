name: CD RESTITUTION API

# [1] WHEN IT RUNS — a merge touching the API's folders (its reference graph, minus the UI), or manual.
on:
  push:
    branches: [development]
    paths:
      - "restitution-app/**"
      - "!restitution-app/ClientApp/**"
      - "Database/**"
      - ".dockerignore"
  workflow_dispatch:

# [2] GUARD RAIL · LEAST PRIVILEGE — read code + write scan reports; registry access = repo secrets only
permissions:
  contents: read
  security-events: write
  actions: read

# [3] GUARD RAIL · ONE BUILD PER IMAGE AT A TIME — a newer merge cancels the stale build
concurrency:
  group: cd-restitution-api-${{ github.ref }}
  cancel-in-progress: true

# [4] THE JOB — hard 30-minute cap
jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # [5] fetch -> registry login -> names+labels -> build+push -> scan -> report
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked files for secrets
        run: |
          if git grep -lIE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KE[Y]|AKIA[0-9A-Z]{16}'; then
            echo "Secret pattern found in the files listed above"
            exit 1
          fi
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Check API packages for HIGH or CRITICAL advisories
        run: |
          dotnet restore restitution-app/restitution-app.csproj
          dotnet list restitution-app/restitution-app.csproj package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -E 'NU1900|NU1903|NU1904|^\s+>.*\s(High|Critical)\s' vulnerable.txt; then exit 1; fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.OCP4_REGISTRY }}
          username: unused
          password: ${{ secrets.OCP4_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.OCP4_REGISTRY }}/${{ secrets.OCP4_NAMESPACE }}/restitution-api
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./restitution-app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_IMAGE_NAME=restitution-api
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max                    # SLSA provenance
          sbom: true                              # SPDX SBOM
